name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows / build and tests
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js for tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up FFmpeg 7.0.2
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/7.0.2/ffmpeg-7.0.2-essentials_build.zip' -OutFile $archive
          $expectedHash = 'D5308D30872B2739CF53169DF61FABA8639D39A19B20B91E611C177EF676F64C'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'FFmpeg SHA-256 verification failed.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Join-Path $destination 'ffmpeg-7.0.2-essentials_build/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Release
        run: dotnet build -c Release -o artifacts/backend-build

      - name: Test geometry, trimming and real FFmpeg exports
        run: node --test tests/geometry.test.mjs tests/trim.test.mjs tests/backend.test.mjs
